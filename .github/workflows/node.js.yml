name: React CI/CD

# Deploys to the production VM, so it runs only for commits that land on main
# (a pull_request trigger would redeploy and restart production for every PR)
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted

    steps:
      # data/calouros.db used to be versioned; keep a copy so the pull that untracks it cannot lose it
      - name: Back up database
        working-directory: /home/calouros/semana-de-recepcao-aos-calouros/
        run: |
          if [ -f data/calouros.db ]; then
            mkdir -p /home/calouros/calouros-db-backups
            cp data/calouros.db "/home/calouros/calouros-db-backups/calouros-$(date +%Y%m%d-%H%M%S).db"
            cp data/calouros.db /home/calouros/calouros-db-backups/latest.db
          fi

      - name: Stash git changes
        working-directory: /home/calouros/semana-de-recepcao-aos-calouros/
        run: git stash

      - name: Pull git changes
        working-directory: /home/calouros/semana-de-recepcao-aos-calouros/
        run: git pull origin main

      - name: Restore database
        working-directory: /home/calouros/semana-de-recepcao-aos-calouros/
        run: |
          if [ ! -f data/calouros.db ] && [ -f /home/calouros/calouros-db-backups/latest.db ]; then
            mkdir -p data
            cp /home/calouros/calouros-db-backups/latest.db data/calouros.db
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: /home/calouros/semana-de-recepcao-aos-calouros/
        run: npm install

      - name: Build App
        working-directory: /home/calouros/semana-de-recepcao-aos-calouros/
        run: npm run build

      # The Node server (deploy/calouros.service) serves dist/ and /api/*; nginx proxies to it
      - name: Restart server
        run: sudo -n systemctl restart calouros

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          echo "Servidor não respondeu em /api/health" >&2
          sudo -n journalctl -u calouros -n 50 --no-pager || true
          exit 1
