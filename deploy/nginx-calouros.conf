# Put these locations inside the existing `server { ... }` block for calouros.icmc.usp.br
# (keep its listen/ssl lines), replacing the old `root /var/www/...` + `location /` that served
# only the static build. Then: sudo nginx -t && sudo systemctl reload nginx

    # XLSX uploads in the admin go up to 20 MB
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gemini parsing of large spreadsheets can take a while
        proxy_read_timeout 120s;
    }
